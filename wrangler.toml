name = "spider-panel-worker"
main = "worker/_worker.js"
compatibility_date = "2024-12-16"
type = "javascript"

# Account and zone configuration
account_id = ""  # Replace with your Cloudflare Account ID
workers_dev = true

# KV Namespace bindings
[[kv_namespaces]]
binding = "SPIDER_KV"
id = "spider-kv-production"
preview_id = "spider-kv-preview"

[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "tunnel-kv-production"
preview_id = "tunnel-kv-preview"

[[kv_namespaces]]
binding = "REVERSE_KV"
id = "reverse-kv-production"
preview_id = "reverse-kv-preview"

# Environment variables
[env.production]
name = "spider-panel-worker-prod"
routes = [
  { pattern = "*.yourdomain.com/*", zone_name = "yourdomain.com" }
]

vars = { PANEL_DOMAIN = "your-panel-domain.up.railway.app", WORKER_DOMAIN = "your-worker-domain.com" }

[env.production.kv_namespaces]
SPIDER_KV = { id = "spider-kv-production", preview_id = "spider-kv-preview" }
TUNNEL_KV = { id = "tunnel-kv-production", preview_id = "tunnel-kv-preview" }
REVERSE_KV = { id = "reverse-kv-production", preview_id = "reverse-kv-preview" }

[env.staging]
name = "spider-panel-worker-staging"
routes = [
  { pattern = "staging.yourdomain.com/*", zone_name = "yourdomain.com" }
]

vars = { PANEL_DOMAIN = "staging-panel-domain.up.railway.app", WORKER_DOMAIN = "staging-worker-domain.com" }

[env.staging.kv_namespaces]
SPIDER_KV = { id = "spider-kv-staging", preview_id = "spider-kv-staging-preview" }
TUNNEL_KV = { id = "tunnel-kv-staging", preview_id = "tunnel-kv-staging-preview" }
REVERSE_KV = { id = "reverse-kv-staging", preview_id = "reverse-kv-staging-preview" }

# Build configuration
[build]
command = "npm install"
cwd = "./"
watch_paths = ["worker/**/*.js"]

# Compatibility flags
compatibility_flags = ["nodejs_compat"]
